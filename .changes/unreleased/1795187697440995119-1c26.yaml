kind: 'Security'
body: 'stopped sending a `GITLAB_TOKEN` or `GL_TOKEN` from the environment to gitlab.com when another variable names a self-managed GitLab server: glab''s `GITLAB_URI`, `GITLAB_API_HOST` and `GITLAB_REPO`, semantic-release''s `GL_URL` and `GITLAB_URL`, Lerna''s `GL_API_URL`, Terraform''s `GITLAB_BASE_URL`, and a GitLab CI job''s `CI_SERVER_URL`, `CI_SERVER_HOST`, `CI_SERVER_FQDN` and `CI_API_V4_URL`. Only `GITLAB_HOST` and `GL_HOST` were checked, so the token of a self-managed server reached gitlab.com. A value that cannot be read now refuses the token as well, and the refusal no longer quotes it'
time: '2026-11-20T15:14:57.440898696Z'
