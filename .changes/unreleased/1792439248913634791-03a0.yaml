kind: 'Fixed'
body: 'fixed `CreateAndSwitchBranch` discarding the local changes of the working tree and deleting every untracked and ignored file in it, such as an operator''s `.env` or build output: it forced a go-git checkout, which resets the working tree hard even when the new branch points at the commit HEAD is on; it now points HEAD at the new branch and leaves the index and the working tree as they are, as `git switch -c` does, and checks any other commit out without forcing, so local changes in the way stop the switch instead of being lost'
time: '2026-10-19T19:47:28.91353416Z'
