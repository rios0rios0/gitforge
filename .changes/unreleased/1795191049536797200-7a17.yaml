kind: 'Added'
body: 'added `CheckGitLabTokenServer`, the credential chain''s GitLab server check, for a GitLab token a consumer exports itself, and `GitLabCIServerHost` and `CheckGitLabCIJobTokenServer`, which judge a GitLab CI job''s `CI_JOB_TOKEN` by the job''s own `CI_SERVER_*` variables alone, so a self-managed runner''s job token is never sent to gitlab.com'
