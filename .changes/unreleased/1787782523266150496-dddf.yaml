kind: 'Added'
body: 'added `FindGlobalConfigFile`, a config lookup that searches only the user''s home directory, for the configuration that belongs to the operator rather than to whatever directory they are standing in. `FindConfigFile` searches the working directory first, and a tool that acts *on* a repository normally runs with that repository as the working directory -- so when the repository carries its own `.<app>.yaml` for per-project overrides, the operator''s configuration is never reached. Nothing about that looks wrong: the project file''s own settings still apply, and only the settings a tool honours exclusively from the operator''s configuration go missing, silently and with no error to notice. `FindConfigFile` is unchanged, so callers that want the old order keep it; callers should fall back to it when the new function reports `ErrConfigFileNotFound`, because an operator with no home configuration has no operator-level settings to lose'
