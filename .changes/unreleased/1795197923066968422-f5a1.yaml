kind: 'Security'
body: 'stopped sending a `GH_TOKEN` or `GITHUB_TOKEN` from the environment to api.github.com while `GITHUB_SERVER_URL` names a host other than github.com or `GITHUB_API_URL` one other than api.github.com, as on a GitHub Enterprise Server or GHE.com (`*.ghe.com`) Actions runner, whose server issued the job''s `GITHUB_TOKEN`. A value that cannot be read refuses the token too, and the refusal names the variable and the host, never the value. A GitHub Enterprise Server or GHE.com runner that sent a github.com token through this fallback must now configure it explicitly'
time: '2026-11-20T18:05:23.06690525Z'
