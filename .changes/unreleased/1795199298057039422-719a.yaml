kind: 'Security'
body: 'stopped taking an `http://` or `https://` remote for GitHub, GitLab, Azure DevOps, Codeberg, Bitbucket or AWS CodeCommit when its host merely contains the forge''s name: `MatchesURL` and `GetServiceTypeByURL` matched a substring of the URL, so `https://github.com.example.net/...`, `https://notgithub.com/...`, a GitHub Enterprise host such as `https://github.company.com/...` or a self-managed `https://gitlab.company.com/...` was handed the github.com or gitlab.com token. An HTTP(S) remote now matches only on the forge''s own hosts (`github.com`, `www.github.com`, `gitlab.com`, `www.gitlab.com`, `dev.azure.com`, an organization''s `<org>.visualstudio.com`, which now matches Azure DevOps too, `codeberg.org`, `bitbucket.org`, `git-codecommit.<region>.amazonaws.com`), and SSH remotes keep matching by name, so host aliases such as `github.com-work` still resolve. `ParseRemoteURL` and `ParsePullRequestURL` now recognise an HTTP(S) URL''s forge the same way, from the same table of hosts: a lookalike no longer parses as github.com, gitlab.com or dev.azure.com, which handed autoupdate''s local mode and code-guru that forge''s token, an organization''s `https://<org>.visualstudio.com` remote and pull request now parse, and a refused remote is named without its user information'
