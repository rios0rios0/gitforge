kind: 'Fixed'
body: 'fixed a forge CLI that kept running after the program asking it for a token was stopped with Ctrl-C, `SIGTERM` or a hangup: `ExecCLIRunner` starts the CLI in a process group of its own, which a terminal''s interrupt does not reach, so the CLI outlived the program and its 30-second limit. On Unix, `SIGINT`, `SIGTERM` and `SIGHUP` are now relayed to the CLI''s process group while it runs, and the first one is sent to the program again once the CLI has exited, so the program ends as it would have. A program with its own handler for the signal receives it twice'
time: '2026-11-20T18:17:31.372800838Z'
